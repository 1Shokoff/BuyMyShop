services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buymyshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-buymyshop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buymyshop} -d ${POSTGRES_DB:-buymyshop}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Наружу порт не публикуем: доступ к БД только изнутри compose-сети.

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-buymyshop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-buymyshop}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Тексты инструкций правятся без пересборки образа.
      - ./content:/app/content:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
